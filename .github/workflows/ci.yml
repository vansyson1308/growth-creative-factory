name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: python -m pip install black==24.10.0 ruff==0.9.6
      - name: Format check
        run: black --check .
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Tests
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core only — no UI or connector extras)
        run: python -m pip install .
      - name: End-to-end dry run with rendering
        run: |
          gcf --version
          gcf run --input examples/ads_sample.csv --out smoke/pipeline --mode dry --max-creatives 12
          gcf create --product "Cloudstep running shoes" --offer "30% off launch week" \
            --benefit "Featherlight 180g build" --n 6 --out smoke/studio --formats all
          gcf render --input examples/posts_sample.csv --out smoke/sheet --formats square,story
          test -f smoke/pipeline/gallery.html
          test "$(find smoke -name '*.png' | wc -l)" -ge 40
      - name: Upload rendered gallery
        uses: actions/upload-artifact@v4
        with:
          name: rendered-creatives
          path: smoke/
          retention-days: 14
